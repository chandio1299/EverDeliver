services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: everdeliver-kafka-1
    ports:
      - "9092:9092"
    environment:
      # These 4 variables fix the "Process Roles" and "KRaft" errors
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # Networking logic for Mac -> Docker
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'

      # Required KRaft Metadata
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Randomly generated UUID for the cluster
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  postgres:
    image: postgres:16.4-alpine
    container_name: everdeliver-postgres-1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: everdeliver
      POSTGRES_USER: everdeliver
      POSTGRES_PASSWORD: everdeliver
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everdeliver -d everdeliver"]
      interval: 5s
      timeout: 5s
      retries: 10

  everdeliver-api:
    build:
      context: .
      dockerfile: everdeliver-api/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/everdeliver
      SPRING_DATASOURCE_USERNAME: everdeliver
      SPRING_DATASOURCE_PASSWORD: everdeliver
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  everdeliver-worker:
    build:
      context: .
      dockerfile: everdeliver-worker/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: mailpit
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/everdeliver
      SPRING_DATASOURCE_USERNAME: everdeliver
      SPRING_DATASOURCE_PASSWORD: everdeliver
      EVERDELIVER_DELIVERY_SIMULATE_FAILURE: "false"
      EVERDELIVER_DELIVERY_SIMULATE_PERMANENT_FAILURE: "false"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    depends_on:
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
      echo-server:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  everdeliver-dashboard:
    build:
      context: ./everdeliver-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      everdeliver-api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: everdeliver-mailpit-1
    ports:
      - "1025:1025"
      - "8025:8025"

  echo-server:
    image: ealen/echo-server:0.9.2
    container_name: everdeliver-echo-1
    ports:
      - "8888:80"

volumes:
  postgres_data:
