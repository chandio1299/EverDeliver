server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/everdeliver
    username: everdeliver
    password: everdeliver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: everdeliver-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.everdeliver.common"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      idle-partition-event-interval: 1000ms
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

everdeliver:
  delivery:
    simulate-failure: false
    simulate-permanent-failure: false
  kafka:
    attempts: 4
    retry-delay-ms: 5000
    retry-multiplier: 6.0
    retry-max-delay-ms: 120000
  providers:
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:}
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      sms-from: ${TWILIO_SMS_FROM:}
      whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
      base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
    http:
      connect-timeout-seconds: 5
      read-timeout-seconds: 15
